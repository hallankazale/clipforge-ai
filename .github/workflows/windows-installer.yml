name: Windows Installer

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build Windows installer
        run: pnpm dist:win

      - name: Verify unpacked media binaries
        shell: pwsh
        run: |
          $root = 'apps/desktop/release/win-unpacked/resources/app.asar.unpacked/node_modules'
          $ffmpeg = Get-ChildItem "$root/ffmpeg-static" -Filter ffmpeg.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          $ffprobe = Get-ChildItem "$root/ffprobe-static" -Filter ffprobe.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not $ffmpeg) { throw 'ffmpeg.exe não foi encontrado em app.asar.unpacked.' }
          if (-not $ffprobe) { throw 'ffprobe.exe não foi encontrado em app.asar.unpacked.' }

          Write-Host "FFmpeg OK: $($ffmpeg.FullName)"
          Write-Host "FFprobe OK: $($ffprobe.FullName)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-AI-Windows-Installer
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 30
