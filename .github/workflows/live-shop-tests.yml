name: Live Shop tests
on:
  pull_request:
    paths:
      - 'apps/live-shop/**'
  push:
    branches: [main]
    paths:
      - 'apps/live-shop/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        working-directory: apps/live-shop
        run: python -m unittest discover -s tests -v
